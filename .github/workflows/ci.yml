# CI: instal·la les dependències i executa els tests del backend i del frontend a cada pull request.
name: CI

on:
  pull_request:
  workflow_dispatch:

# Si es fa un push nou a la mateixa PR, es cancel·la l'execució anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Base de dades PostgreSQL temporal: només viu mentre dura el job.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biblioteca
          POSTGRES_USER: biblioteca
          POSTGRES_PASSWORD: biblioteca-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biblioteca -d biblioteca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valors només per a la BD temporal de la CI; no són secrets.
    env:
      DJANGO_SECRET_KEY: clau-nomes-per-a-la-ci
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca-ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instal·la les dependències
        run: pip install -r requirements-dev.txt

      - name: Comprova la configuració de Django
        run: python manage.py check

      - name: Executa els tests
        run: pytest

  frontend:
    name: Frontend (build i tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instal·la les dependències
        run: npm ci

      - name: Compila
        run: npm run build

      # S'executa quan existeixi l'script "test" al package.json (Vitest encara no està configurat).
      - name: Executa els tests
        run: npm run test --if-present
